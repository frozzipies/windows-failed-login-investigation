name: redlimit-windows-failed-login

# Development baseline only. This runs ONE challenge UI for local development and
# integration testing. It is NOT a multi-participant spawner and NOT a production
# configuration. For runtime, the spawner creates one isolated container per
# session from the published immutable image.

services:
  challenge-ui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CHALLENGE_SLUG: windows-failed-login-investigation
      DATASET_PATH: /app/dataset/windows_security_events.json
      TASKS_ENABLED: ${TASKS_ENABLED:-false}
      SESSION_ID: ${SESSION_ID:-local-dev-session}
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - challenge-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  challenge-internal:
    internal: true
